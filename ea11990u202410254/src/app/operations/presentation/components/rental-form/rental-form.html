<mat-card appearance="outlined" class="rental-form-card">
  <form [formGroup]="form" (ngSubmit)="onCreate()" aria-label="New rental form">
    <mat-card-content class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'new-rental.vehicle' | translate }}</mat-label>
        <mat-select formControlName="vehicleId">
          @for (vehicle of availableVehicles(); track vehicle.id) {
            <mat-option [value]="vehicle.id">
              {{ vehicle.make }} {{ vehicle.model }} - {{ vehicle.vehicleType }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'new-rental.client-id' | translate }}</mat-label>
        <input matInput type="number" formControlName="clientId" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'new-rental.duration-days' | translate }}</mat-label>
        <input matInput type="number" formControlName="durationDays" />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button type="button" (click)="onCancel()">
        {{ 'actions.cancel' | translate }}
      </button>

      <button mat-raised-button color="primary" type="submit">
        {{ 'actions.create' | translate }}
      </button>
    </mat-card-actions>
  </form>
</mat-card>
